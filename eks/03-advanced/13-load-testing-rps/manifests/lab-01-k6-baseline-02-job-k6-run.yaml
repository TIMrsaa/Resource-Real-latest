# Source: eks/03-advanced/13-load-testing-rps/lab-01-k6-baseline.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: batch/v1
kind: Job
metadata: { name: k6-run, namespace: loadlab }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:0.57.0
        args: [run, /scripts/load.js]
        env: [{ name: VUS, value: "$VUS" }]
        resources: { requests: { cpu: "1", memory: 256Mi } }   # 부하기가 병목이면 안 됩니다!
        volumeMounts: [{ name: s, mountPath: /scripts }]
      volumes: [{ name: s, configMap: { name: k6-script } }]
