# Source: eks/03-advanced/16-ip-exhaustion/lab-02-custom-networking.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: migrant
  labels: { run: migrant }
spec:
  nodeSelector: { iplab: "true" }
  containers:
    - name: migrant
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
