# Source: eks/03-advanced/20-service-mesh-eks/lab-01-istio-mtls.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: meshlab
  labels: { app: client }
spec:
  replicas: 1
  selector:
    matchLabels: { app: client }
  template:
    metadata:
      labels: { app: client }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: meshlab
spec:
  selector: { app: web }
  ports:
    - port: 9898
