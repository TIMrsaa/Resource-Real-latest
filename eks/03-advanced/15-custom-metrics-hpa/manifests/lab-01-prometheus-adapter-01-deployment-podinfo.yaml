# Source: eks/03-advanced/15-custom-metrics-hpa/lab-01-prometheus-adapter.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: podinfo, namespace: scalelab }
spec:
  replicas: 2
  selector: { matchLabels: { app: podinfo } }
  template:
    metadata:
      labels: { app: podinfo }
      annotations:                          # Prometheus에게 "나를 긁어라"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        ports: [{ containerPort: 9898 }]
        resources: { requests: { cpu: 100m, memory: 64Mi } }
        readinessProbe: { httpGet: { path: /readyz, port: 9898 } }
---
apiVersion: v1
kind: Service
metadata: { name: podinfo, namespace: scalelab }
spec:
  selector: { app: podinfo }
  ports: [{ port: 9898 }]
