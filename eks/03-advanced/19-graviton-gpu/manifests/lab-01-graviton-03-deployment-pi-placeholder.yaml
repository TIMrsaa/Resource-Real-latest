# Source: eks/03-advanced/19-graviton-gpu/lab-01-graviton.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-$arch
  labels: { app: pi-$arch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pi-$arch }
  template:
    metadata:
      labels: { app: pi-$arch }
    spec:
      nodeSelector:
        kubernetes.io/arch: $arch          # 같은 이미지가 양쪽 아치에서 도는지 비교
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
---
apiVersion: v1
kind: Service
metadata:
  name: pi-$arch
spec:
  selector: { app: pi-$arch }
  ports:
    - port: 9898
