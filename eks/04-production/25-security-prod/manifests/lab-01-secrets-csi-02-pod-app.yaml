# Source: eks/04-production/25-security-prod/lab-01-secrets-csi.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata: { name: app, namespace: seclab }
spec:
  serviceAccountName: app-sa
  containers:
  - name: app
    image: public.ecr.aws/docker/library/busybox:stable
    command: [sleep, "3600"]
    volumeMounts:
    - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
  volumes:
  - name: secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes: { secretProviderClass: db-secret }
