# Source: eks/04-production/26-troubleshooting-eks/lab-01-reproduce-diagnose.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filler
  namespace: tslab
  labels: { app: filler }
spec:
  replicas: $((MAXPODS - CUR + 3))         # maxPods를 넘기는 수 — IP 고갈 재현
  selector:
    matchLabels: { app: filler }
  template:
    metadata:
      labels: { app: filler }
    spec:
      nodeName: $NODE                      # 관찰 대상 노드에 몰아넣기
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.10
