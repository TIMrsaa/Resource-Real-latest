# Source: eks/04-production/23-multi-cluster/lab-01-fleet-vcluster.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: standard-app, namespace: default }
spec:
  replicas: 2
  selector: { matchLabels: { app: standard-app } }
  template:
    metadata: { labels: { app: standard-app } }
    spec:
      containers:
      - name: app
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        env: [{ name: PODINFO_UI_MESSAGE, value: base }]
        resources: { requests: { cpu: 100m, memory: 64Mi } }
