# Source: eks/01-beginner/04-eks-auto-mode/lab-02-builtin-capabilities.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: small-pod
  labels: { run: small-pod }
spec:
  nodeSelector: { karpenter.sh/nodepool: small-only }
  tolerations:
    - key: pool
      value: small
      effect: NoSchedule
  containers:
    - name: small-pod
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
      resources:
        requests: { cpu: 500m, memory: 256Mi }
