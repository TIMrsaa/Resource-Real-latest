# Source: eks/01-beginner/06-fargate/lab-02-limits-decision.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: host-try
  namespace: serverless
  labels: { run: host-try }
spec:
  hostNetwork: true                # ← Fargate가 지원 안 하는 요구 (거부 확인용)
  containers:
    - name: host-try
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "60"]
