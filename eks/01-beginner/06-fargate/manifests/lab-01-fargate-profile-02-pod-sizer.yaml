# Source: eks/01-beginner/06-fargate/lab-01-fargate-profile.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: sizer
  namespace: serverless
  labels: { run: sizer }
spec:
  containers:
    - name: sizer
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
      resources:
        requests: { cpu: 300m, memory: 600Mi }
