# Source: eks/01-beginner/05-managed-nodegroups/lab-01-nodegroup-anatomy.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata: { name: $CLUSTER, region: $AWS_REGION }
managedNodeGroups:
- name: spot-batch
  instanceTypes: [t3.large, t3a.large, m5.large]   # 다양화 (theory §3)
  spot: true
  desiredCapacity: 1
  minSize: 0
  maxSize: 2
  labels: { pool: spot-batch }
  taints: [{ key: pool, value: spot-batch, effect: NoSchedule }]
