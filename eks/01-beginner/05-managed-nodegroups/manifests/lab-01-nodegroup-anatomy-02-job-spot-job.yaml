# Source: eks/01-beginner/05-managed-nodegroups/lab-01-nodegroup-anatomy.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: batch/v1
kind: Job
metadata: { name: spot-job }
spec:
  parallelism: 2
  completions: 4
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { pool: spot-batch }
      tolerations: [{ key: pool, value: spot-batch, effect: NoSchedule }]
      containers:
      - name: work
        image: public.ecr.aws/docker/library/busybox:stable
        command: [sh, -c, 'echo crunching on $(hostname); sleep 20']
        resources: { requests: { cpu: 250m, memory: 128Mi } }
