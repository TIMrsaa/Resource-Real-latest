# Source: eks/02-intermediate/08-alb-controller/lab-01-install-alb-ingress.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: web
  labels: { app: shop }
spec:
  replicas: 3
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: web
spec:
  selector: { app: shop }
  ports:
    - port: 80
      targetPort: 8080
