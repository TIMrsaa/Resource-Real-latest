# Source: eks/02-intermediate/12-observability-aws/lab-01-container-insights.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatterbox
  namespace: obs
  labels: { app: chatterbox }
spec:
  replicas: 1
  selector:
    matchLabels: { app: chatterbox }
  template:
    metadata:
      labels: { app: chatterbox }
    spec:
      containers:
        - name: chatterbox
          image: public.ecr.aws/docker/library/busybox:stable
          command: ["sh", "-c", 'while true; do echo "hello from chatterbox rps=$((RANDOM%100))"; sleep 2; done']
