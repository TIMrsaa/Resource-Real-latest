# Source: eks/02-intermediate/09-irsa-pod-identity/lab-02-pod-identity.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: awscli-pi
  namespace: iam-lab
  labels: { run: awscli-pi }
spec:
  serviceAccountName: s3-reader-pi       # ← Pod Identity association 대상 SA
  containers:
    - name: awscli-pi
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sleep", "3600"]
