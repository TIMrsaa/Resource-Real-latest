# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: awscli
  namespace: iam-lab
  labels: { run: awscli }
spec:
  serviceAccountName: s3-reader          # ← IRSA 어노테이션이 붙은 SA
  containers:
    - name: awscli
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sleep", "3600"]
