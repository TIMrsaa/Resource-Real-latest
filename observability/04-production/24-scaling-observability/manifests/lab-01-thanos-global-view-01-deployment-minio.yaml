# Source: observability/04-production/24-scaling-observability/lab-01-thanos-global-view.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: storage }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          env:
            - { name: MINIO_ROOT_USER, value: thanos }
            - { name: MINIO_ROOT_PASSWORD, value: thanos-secret }
          ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: storage }
spec: { selector: { app: minio }, ports: [{ port: 9000 }] }
