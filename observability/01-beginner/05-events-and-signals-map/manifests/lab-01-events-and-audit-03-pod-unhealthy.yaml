# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata: { name: unhealthy }
spec:
  containers:
    - name: c
      image: nginx
      livenessProbe:
        httpGet: { path: /nope, port: 9999 }
        periodSeconds: 3
