# Source: observability/01-beginner/03-metrics-basics/lab-02-two-metric-pipelines.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-me
  labels: { app: scale-me }
spec:
  replicas: 1
  selector:
    matchLabels: { app: scale-me }
  template:
    metadata:
      labels: { app: scale-me }
    spec:
      containers:
        - name: nginx
          image: nginx
          resources:
            requests: { cpu: 100m }    # HPA %의 분모 — 없으면 <unknown>
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scale-me
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scale-me
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
