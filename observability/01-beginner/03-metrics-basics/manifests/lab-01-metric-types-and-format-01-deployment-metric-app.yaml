# Source: observability/01-beginner/03-metrics-basics/lab-01-metric-types-and-format.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: metric-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: metric-app } }
  template:
    metadata: { labels: { app: metric-app } }
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: metric-app }
spec:
  selector: { app: metric-app }
  ports: [{ port: 8080 }]
