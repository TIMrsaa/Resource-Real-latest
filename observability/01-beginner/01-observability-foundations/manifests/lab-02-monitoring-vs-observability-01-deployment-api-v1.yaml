# Source: observability/01-beginner/01-observability-foundations/lab-02-monitoring-vs-observability.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-v1 }
spec:
  replicas: 2
  selector: { matchLabels: { app: api, ver: v1 } }
  template:
    metadata: { labels: { app: api, ver: v1 } }
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo
          args: ["-text=ok-v1", "-listen=:8080"]
          ports: [{ containerPort: 8080 }]
