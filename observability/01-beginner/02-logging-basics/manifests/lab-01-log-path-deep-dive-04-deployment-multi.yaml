# Source: observability/01-beginner/02-logging-basics/lab-01-log-path-deep-dive.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi
  labels: { app: multi }
spec:
  replicas: 3
  selector:
    matchLabels: { app: multi }
  template:
    metadata:
      labels: { app: multi }
    spec:
      containers:
        - name: multi
          image: busybox
          command:
            - sh
            - -c
            - 'while true; do echo "pod says hello at $(date +%T)"; sleep 5; done'
