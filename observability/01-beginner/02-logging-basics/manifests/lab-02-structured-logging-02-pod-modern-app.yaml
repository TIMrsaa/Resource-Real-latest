# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: v1
kind: Pod
metadata: { name: modern-app }
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh","-c"]
      args:
        - |
          while true; do
            u=$((RANDOM % 5 + 100));
            amt=$((RANDOM % 900 + 100));
            ts=$(date -Iseconds);
            if [ $((RANDOM % 4)) -eq 0 ]; then
              echo "{\"ts\":\"$ts\",\"level\":\"error\",\"event\":\"payment_failed\",\"user_id\":$u,\"amount\":$amt,\"reason\":\"gateway_timeout\",\"retries\":3}";
            else
              echo "{\"ts\":\"$ts\",\"level\":\"info\",\"event\":\"payment_ok\",\"user_id\":$u,\"amount\":$amt}";
            fi;
            sleep 0.2;
          done
