# Source: observability/01-beginner/02-logging-basics/lab-01-log-path-deep-dive.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: v1
kind: Pod
metadata: { name: flooder }
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh","-c"]
      # 줄당 ~1KB × 초당 ~2000줄 ≈ 2MB/s
      args: ['i=0; line=$(head -c 1000 /dev/zero | tr "\0" "y");
              while true; do i=$((i+1)); echo "$i $line"; done']
