# Source: observability/03-advanced/14-amp-managed-prometheus/lab-01-remote-write-irsa.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
prometheus:
  prometheusSpec:
    serviceAccountName: amp-irsa
    retention: 2h                          # ★ 하이브리드: 로컬은 짧게
    remoteWrite:
      - url: ${AMP_ENDPOINT}api/v1/remote_write
        sigv4:
          region: ${REGION}
        queueConfig:
          maxSamplesPerSend: 1000
          capacity: 2500
          maxShards: 10
