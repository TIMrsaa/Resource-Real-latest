# Source: observability/02-intermediate/07-fluentd-aggregator/lab-01-two-tier-pipeline.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: ConfigMap
metadata: { name: fluentd-config, namespace: logging }
data:
  fluent.conf: |
    <source>
      @type forward
      port 24224
      bind 0.0.0.0
    </source>

    # 집계층 표식 추가 (멀티클러스터 대비 — 어느 클러스터에서 왔나)
    <filter kube.**>
      @type record_transformer
      <record>
        cluster kind-twotier
        tier aggregated
      </record>
    </filter>

    # 일단 stdout으로 (목적지는 lab-02·12·13·18에서)
    <match kube.**>
      @type stdout
    </match>
    <match **>
      @type stdout
    </match>
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fluentd, namespace: logging }
spec:
  replicas: 2                       # ★ 집계층도 가용성 (단일점 금지)
  selector: { matchLabels: { app: fluentd } }
  template:
    metadata: { labels: { app: fluentd } }
    spec:
      containers:
        - name: fluentd
          image: fluent/fluentd:v1.17-1
          ports: [{ containerPort: 24224 }]
          volumeMounts: [{ name: cfg, mountPath: /fluentd/etc }]
      volumes: [{ name: cfg, configMap: { name: fluentd-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: fluentd, namespace: logging }
spec:
  selector: { app: fluentd }
  ports: [{ port: 24224 }]
