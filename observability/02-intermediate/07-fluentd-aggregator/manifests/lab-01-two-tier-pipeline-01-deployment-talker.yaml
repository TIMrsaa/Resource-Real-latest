# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talker
  labels: { app: talker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: talker }
  template:
    metadata:
      labels: { app: talker }
    spec:
      containers:
        - name: talker
          image: busybox
          command:
            - sh
            - -c
            - |
              i=0; while true; do i=$((i+1)); echo "{\"seq\":$i,\"card\":\"1234-5678-9012-3456\",\"msg\":\"order placed\"}"; sleep 0.5; done
