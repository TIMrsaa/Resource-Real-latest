# Source: observability/02-intermediate/10-alerting-alertmanager/lab-01-alert-rules.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: payment-rules
  namespace: shop
  labels: { release: monitoring }
spec:
  groups:
    - name: payment.record
      interval: 30s
      rules:
        - record: job:http_error_ratio:rate5m
          expr: |
            sum by (job) (rate(http_requests_total{code=~"5.."}[5m]))
            / sum by (job) (rate(http_requests_total[5m]))
