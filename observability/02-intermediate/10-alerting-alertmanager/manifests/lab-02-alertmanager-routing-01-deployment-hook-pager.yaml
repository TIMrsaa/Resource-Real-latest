# Source: observability/02-intermediate/10-alerting-alertmanager/lab-02-alertmanager-routing.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: hook-pager, namespace: receivers }
spec:
  replicas: 1
  selector: { matchLabels: { app: hook-pager } }
  template:
    metadata: { labels: { app: hook-pager } }
    spec:
      containers:
        - name: c
          image: mendhak/http-https-echo:31
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: hook-pager, namespace: receivers }
spec: { selector: { app: hook-pager }, ports: [{ port: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hook-slack, namespace: receivers }
spec:
  replicas: 1
  selector: { matchLabels: { app: hook-slack } }
  template:
    metadata: { labels: { app: hook-slack } }
    spec:
      containers:
        - name: c
          image: mendhak/http-https-echo:31
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: hook-slack, namespace: receivers }
spec: { selector: { app: hook-slack }, ports: [{ port: 8080 }] }
