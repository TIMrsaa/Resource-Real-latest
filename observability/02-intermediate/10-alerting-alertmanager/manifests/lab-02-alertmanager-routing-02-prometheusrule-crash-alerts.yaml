# Source: observability/02-intermediate/10-alerting-alertmanager/lab-02-alertmanager-routing.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crash-alerts
  namespace: shop
  labels: { release: monitoring }
spec:
  groups:
    - name: crash.alerts
      rules:
        - alert: PodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="shop"}[10m]) > 1
          labels: { severity: page, team: commerce }
          annotations: { summary: "{{ $labels.pod }} 재시작 반복" }
