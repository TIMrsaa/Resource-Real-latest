# Source: observability/02-intermediate/11-otel-instrumentation/lab-01-auto-instrumentation.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata: { name: debug, namespace: observability }
spec:
  mode: deployment
  config:
    receivers:
      otlp: { protocols: { grpc: {}, http: {} } }
    processors:
      batch: {}
    exporters:
      debug: { verbosity: normal }       # 받은 span을 stdout에
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
