# Source: observability/02-intermediate/11-otel-instrumentation/lab-01-auto-instrumentation.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: ConfigMap
metadata: { name: app-a-code, namespace: shop }
data:
  app.py: |
    from flask import Flask
    import requests
    app = Flask(__name__)
    @app.route("/order")
    def order():
        r = requests.get("http://app-b:8080/stock")   # ← 여기 전파가 자동으로!
        return {"order": "ok", "stock": r.json()["stock"]}
    app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app-a, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: app-a } }
  template:
    metadata:
      labels: { app: app-a }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["sh","-c","pip install flask requests -q && python /code/app.py"]
          volumeMounts: [{ name: code, mountPath: /code }]
      volumes: [{ name: code, configMap: { name: app-a-code } }]
---
apiVersion: v1
kind: Service
metadata: { name: app-a, namespace: shop }
spec: { selector: { app: app-a }, ports: [{ port: 8080 }] }
