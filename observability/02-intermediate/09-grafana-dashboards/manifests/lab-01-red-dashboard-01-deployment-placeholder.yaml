# Source: observability/02-intermediate/09-grafana-dashboards/lab-01-red-dashboard.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: Deployment
metadata: { name: $svc, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: $svc } }
  template:
    metadata: { labels: { app: $svc } }
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports: [{ name: http, containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: $svc, namespace: shop, labels: { app: $svc } }
spec:
  selector: { app: $svc }
  ports: [{ name: metrics, port: 8080 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: $svc, namespace: shop, labels: { release: monitoring } }
spec:
  selector: { matchLabels: { app: $svc } }
  endpoints: [{ port: metrics, interval: 15s }]
