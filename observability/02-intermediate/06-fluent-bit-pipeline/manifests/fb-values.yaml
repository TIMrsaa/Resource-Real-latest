# Source: observability/02-intermediate/06-fluent-bit-pipeline/lab-01-pipeline-basics.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        multiline.parser  cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     20MB
  filters: |
    [FILTER]
        Name              kubernetes
        Match             kube.*
        Merge_Log         On
        Keep_Log          Off
        Use_Kubelet       Off
  outputs: |
    [OUTPUT]
        Name              stdout
        Match             kube.*
        Format            json_lines
