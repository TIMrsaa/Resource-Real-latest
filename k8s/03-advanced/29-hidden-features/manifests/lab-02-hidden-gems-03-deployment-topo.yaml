# Source: k8s/03-advanced/29-hidden-features/lab-02-hidden-gems.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topo
  labels: { app: topo }
spec:
  replicas: 4
  selector:
    matchLabels: { app: topo }
  template:
    metadata:
      labels: { app: topo }
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: topo
spec:
  selector: { app: topo }
  ports:
    - port: 80
      targetPort: 8080
