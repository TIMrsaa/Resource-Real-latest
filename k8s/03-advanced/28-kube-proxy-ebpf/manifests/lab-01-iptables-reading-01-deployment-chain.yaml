# Source: k8s/03-advanced/28-kube-proxy-ebpf/lab-01-iptables-reading.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain
  labels: { app: chain }
spec:
  replicas: 3
  selector:
    matchLabels: { app: chain }
  template:
    metadata:
      labels: { app: chain }
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: chain
spec:
  selector: { app: chain }
  ports:
    - port: 80
      targetPort: 8080
