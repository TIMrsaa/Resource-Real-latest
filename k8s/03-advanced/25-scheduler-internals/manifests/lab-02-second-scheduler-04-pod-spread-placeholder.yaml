# Source: k8s/03-advanced/25-scheduler-internals/lab-02-second-scheduler.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: v1
kind: Pod
metadata:
  name: spread-$i
  labels: { run: spread-$i }
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
      resources:
        requests: { cpu: 200m }
---
apiVersion: v1
kind: Pod
metadata:
  name: pack-$i
  labels: { run: pack-$i }
spec:
  schedulerName: cost-scheduler
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
      resources:
        requests: { cpu: 200m }
