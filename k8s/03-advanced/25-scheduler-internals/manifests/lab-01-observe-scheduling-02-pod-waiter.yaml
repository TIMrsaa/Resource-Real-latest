# Source: k8s/03-advanced/25-scheduler-internals/lab-01-observe-scheduling.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: waiter
  labels: { run: waiter }
spec:
  containers:
    - name: waiter
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
      resources:
        requests:
          cpu: 1500m
