# Source: k8s/03-advanced/25-scheduler-internals/lab-02-second-scheduler.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: ConfigMap
metadata: { name: cost-scheduler-config, namespace: scheduler-lab }
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
    - schedulerName: cost-scheduler
      pluginConfig:
      - name: NodeResourcesFit
        args:
          scoringStrategy:
            type: MostAllocated          # ★ 꽉 채우기
            resources: [{ name: cpu, weight: 1 }, { name: memory, weight: 1 }]
