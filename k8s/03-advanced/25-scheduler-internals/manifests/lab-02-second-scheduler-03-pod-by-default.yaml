# Source: k8s/03-advanced/25-scheduler-internals/lab-02-second-scheduler.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: by-default
  labels: { run: by-default }
spec:
  containers:
    - name: by-default
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
---
apiVersion: v1
kind: Pod
metadata:
  name: by-cost
  labels: { run: by-cost }
spec:
  schedulerName: cost-scheduler        # ← 이 한 줄이 담당 스케줄러를 바꿉니다
  containers:
    - name: by-cost
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
