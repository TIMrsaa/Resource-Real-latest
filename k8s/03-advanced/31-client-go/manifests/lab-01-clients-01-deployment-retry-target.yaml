# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retry-target
  labels: { app: retry-target }
spec:
  replicas: 1
  selector:
    matchLabels: { app: retry-target }
  template:
    metadata:
      labels: { app: retry-target }
    spec:
      containers:
        - name: retry-target
          image: public.ecr.aws/nginx/nginx:1.27
