# Source: k8s/03-advanced/32-pod-security/lab-02-psa-userns.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: hacker
  namespace: secure-zone
  labels: { run: hacker }
spec:
  containers:
    - name: hacker
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
      securityContext:
        privileged: true          # ← restricted 프로파일이 거부해야 정상
