# Source: k8s/03-advanced/32-pod-security/lab-01-securitycontext.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: nonroot-ok
  labels: { run: nonroot-ok }
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: nonroot-ok
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
