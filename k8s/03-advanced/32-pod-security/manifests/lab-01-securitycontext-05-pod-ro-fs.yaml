# Source: k8s/03-advanced/32-pod-security/lab-01-securitycontext.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: ro-fs
  labels: { run: ro-fs }
spec:
  containers:
    - name: ro-fs
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
      securityContext:
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: tmp
          mountPath: /tmp          # 쓰기가 필요한 곳만 emptyDir로 뚫어줌
  volumes:
    - name: tmp
      emptyDir: {}
