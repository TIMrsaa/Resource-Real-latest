# Source: k8s/03-advanced/26-kubelet-cri/lab-02-qos-eviction-static.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# Guaranteed: requests == limits
apiVersion: v1
kind: Pod
metadata:
  name: qos-g
  labels: { run: qos-g }
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits: { cpu: 100m, memory: 64Mi }
---
# Burstable: requests < limits
apiVersion: v1
kind: Pod
metadata:
  name: qos-b
  labels: { run: qos-b }
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
      resources:
        requests: { memory: 32Mi }
        limits: { memory: 128Mi }
---
# BestEffort: resources 없음
apiVersion: v1
kind: Pod
metadata:
  name: qos-be
  labels: { run: qos-be }
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "600"]
