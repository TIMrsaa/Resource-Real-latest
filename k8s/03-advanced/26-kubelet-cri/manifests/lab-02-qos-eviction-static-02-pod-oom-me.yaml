# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: oom-me
  labels: { run: oom-me }
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sh", "-c", "head -c 100m /dev/zero | tail"]
      resources:
        limits: { memory: 50Mi }
