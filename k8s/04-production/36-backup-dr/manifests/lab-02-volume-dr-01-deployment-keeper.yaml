# Source: k8s/04-production/36-backup-dr/lab-02-volume-dr.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data, namespace: shop }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3                    # 08의 StorageClass
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keeper, namespace: shop }
spec:
  replicas: 1
  strategy: { type: Recreate }             # RWO 볼륨 — 07의 그 이유
  selector: { matchLabels: { app: keeper } }
  template:
    metadata:
      labels: { app: keeper }
    spec:
      volumes: [{ name: data, persistentVolumeClaim: { claimName: data } }]
      containers:
      - name: app
        image: public.ecr.aws/docker/library/busybox:stable
        command: [sleep, "3600"]
        volumeMounts: [{ name: data, mountPath: /data }]
