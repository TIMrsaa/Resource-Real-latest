# Source: k8s/04-production/38-troubleshooting/lab-01-workload-failures.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: dr-lab
  labels: { run: oom }
spec:
  restartPolicy: Never
  containers:
    - name: oom
      image: polinux/stress
      command: ["stress", "--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
      resources:
        limits: { memory: 100Mi }
