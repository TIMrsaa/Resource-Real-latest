# Source: k8s/04-production/35-upgrades/lab-01-preflight.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-app
  labels: { app: ha-app }
spec:
  replicas: 3
  selector:
    matchLabels: { app: ha-app }
  template:
    metadata:
      labels: { app: ha-app }
    spec:
      containers:
        - name: ha-app
          image: public.ecr.aws/nginx/nginx:1.29-unprivileged
