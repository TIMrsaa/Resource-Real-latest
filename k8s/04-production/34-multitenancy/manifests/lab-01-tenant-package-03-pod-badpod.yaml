# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: badpod
  namespace: team-rocket
  labels: { run: badpod }
spec:
  containers:
    - name: badpod
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "60"]
      securityContext:
        privileged: true          # ← PSA restricted가 거부해야 정상
