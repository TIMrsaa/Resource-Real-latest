# Source: k8s/04-production/34-multitenancy/lab-02-node-isolation.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: sneaky
  namespace: team-galaxy
  labels: { run: sneaky }
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  tolerations:                              # 남의 팀 taint를 견디겠다고 선언
    - key: tenant
      operator: Equal
      value: team-rocket
      effect: NoSchedule
  nodeSelector: { tenant: team-rocket }     # 남의 팀 노드를 지목
  containers:
    - name: sneaky
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
