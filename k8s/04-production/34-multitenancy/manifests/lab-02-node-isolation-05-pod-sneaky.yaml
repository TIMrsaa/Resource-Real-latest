# Source: k8s/04-production/34-multitenancy/lab-02-node-isolation.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: sneaky
  namespace: team-galaxy
  labels: { run: sneaky }
spec:
  tolerations:
    - key: tenant
      operator: Equal
      value: team-rocket
      effect: NoSchedule
  containers:
    - name: sneaky
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
