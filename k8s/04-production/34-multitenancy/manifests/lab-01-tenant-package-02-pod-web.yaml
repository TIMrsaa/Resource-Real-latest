# Source: k8s/04-production/34-multitenancy/lab-01-tenant-package.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: team-galaxy
  labels: { app: web }
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: team-galaxy
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 8080
