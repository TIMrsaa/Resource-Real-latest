# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: broken }
spec:
  replicas: 2
  selector: { matchLabels: { app: broken } }
  template:
    metadata: { labels: { app: broken } }
    spec:
      containers:
      - name: web
        image: public.ecr.aws/nginx/nginx:1.99-typo
        readinessProbe: { httpGet: { path: /, port: 8080 } }
