# Source: k8s/04-production/37-scale-tuning/lab-01-apf-list-cost.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet
  labels: { app: fleet }
spec:
  replicas: 60
  selector:
    matchLabels: { app: fleet }
  template:
    metadata:
      labels: { app: fleet }
    spec:
      containers:
        - name: fleet
          image: public.ecr.aws/docker/library/busybox:stable
          command: ["sleep", "3600"]
