# Source: k8s/04-production/37-scale-tuning/lab-02-kwok-1000-nodes.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Node
metadata:
  name: kwok-node-__N__
  annotations:
    kwok.x-k8s.io/node: fake          # kwok가 이 노드를 연기
  labels:
    type: kwok
spec:
  taints:                             # 진짜 워크로드(DaemonSet 등)가 못 오게
  - key: kwok.x-k8s.io/node
    value: fake
    effect: NoSchedule
status:
  allocatable: { cpu: "32", memory: 256Gi, pods: "110" }
  capacity:    { cpu: "32", memory: 256Gi, pods: "110" }
