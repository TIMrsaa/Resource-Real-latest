# init + 네이티브 sidecar 타임라인 관찰용
apiVersion: v1
kind: Pod
metadata:
  name: startup-order
spec:
  initContainers:
  - name: step1-init                 # ① 먼저 실행되고 종료
    image: public.ecr.aws/docker/library/busybox:stable
    command: ["sh", "-c", "echo '[init] preparing...'; sleep 5; echo '[init] done'"]
  - name: step2-sidecar              # ② init 다음, 본 컨테이너 전에 시작해서 계속 살아있음
    image: public.ecr.aws/docker/library/busybox:stable
    restartPolicy: Always            # ← 이 줄이 네이티브 sidecar 선언 (없으면 일반 init)
    command: ["sh", "-c", "echo '[sidecar] up'; while true; do sleep 3600; done"]
  containers:
  - name: step3-app                  # ③ 마지막에 시작
    image: public.ecr.aws/docker/library/busybox:stable
    command: ["sh", "-c", "echo '[app] started'; while true; do sleep 3600; done"]
