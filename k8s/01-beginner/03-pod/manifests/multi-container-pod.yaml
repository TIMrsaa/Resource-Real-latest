# 멀티 컨테이너 Pod — NET namespace와 볼륨 공유 실험용
apiVersion: v1
kind: Pod
metadata:
  name: duo
  labels:
    app: duo
spec:
  volumes:
  - name: shared            # 두 컨테이너가 공유할 빈 디렉터리 (Pod 수명과 같음)
    emptyDir: {}
  containers:
  - name: writer            # 1초마다 시간을 공유 볼륨에 기록
    image: public.ecr.aws/docker/library/busybox:stable
    command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 1; done"]
    volumeMounts:
    - name: shared
      mountPath: /data
  - name: web               # 같은 볼륨을 웹으로 노출
    image: public.ecr.aws/docker/library/busybox:stable
    command: ["sh", "-c", "httpd -f -p 8080 -h /data"]
    volumeMounts:
    - name: shared
      mountPath: /data
