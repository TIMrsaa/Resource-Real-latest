apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  GREETING: "hello"
  app.properties: |
    color=blue
    mode=normal
---
# 같은 ConfigMap을 환경변수와 볼륨, 두 방식으로 동시에 주입 (갱신 실험용)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-demo }
  template:
    metadata:
      labels: { app: config-demo }
    spec:
      volumes:
      - name: config-vol
        configMap: { name: app-config }
      containers:
      - name: app
        image: public.ecr.aws/docker/library/busybox:stable
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        envFrom:
        - configMapRef: { name: app-config }     # 방식 ①: 환경변수
        volumeMounts:
        - name: config-vol                        # 방식 ②: 파일
          mountPath: /etc/config
          readOnly: true
        resources:
          requests: { cpu: 10m, memory: 16Mi }
