# Source: k8s/01-beginner/07-config-secret/lab-01-configmap.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: missing-ref
  labels: { run: missing-ref }
spec:
  containers:
    - name: missing-ref
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
      envFrom:
        - configMapRef: { name: no-such-config }
