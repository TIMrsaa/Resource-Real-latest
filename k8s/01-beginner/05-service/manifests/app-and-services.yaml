# 백엔드: 자기 Pod 이름을 응답하는 에코 서버 (분배 관찰용)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]   # /hostname 등 진단 엔드포인트 제공
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 3
        resources:
          requests: { cpu: 50m, memory: 64Mi }
---
# ClusterIP (기본형)
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector:
    app: echo
  ports:
  - port: 80            # Service 포트
    targetPort: 8080    # 컨테이너 포트
