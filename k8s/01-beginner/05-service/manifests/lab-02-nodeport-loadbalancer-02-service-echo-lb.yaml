# Source: k8s/01-beginner/05-service/lab-02-nodeport-loadbalancer.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Service
metadata:
  name: echo-lb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"   # ← 이 줄이 없으면 Classic ELB가 생성됨
spec:
  type: LoadBalancer
  selector:
    app: echo
  ports:
  - port: 80
    targetPort: 8080
