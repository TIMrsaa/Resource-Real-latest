# Source: k8s/01-beginner/08-storage-basics/lab-01-ephemeral-volumes.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: scratch
spec:
  volumes:
  - name: tmp
    emptyDir: {}
  containers:
  - name: app
    image: public.ecr.aws/docker/library/busybox:stable
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts: [{ name: tmp, mountPath: /scratch }]
