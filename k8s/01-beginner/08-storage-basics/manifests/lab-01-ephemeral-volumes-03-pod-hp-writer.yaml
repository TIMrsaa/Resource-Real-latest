# Source: k8s/01-beginner/08-storage-basics/lab-01-ephemeral-volumes.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: v1
kind: Pod
metadata:
  name: hp-writer
spec:
  volumes:
  - name: hostdir
    hostPath: { path: /tmp/lab-hostpath, type: DirectoryOrCreate }
  containers:
  - name: app
    image: public.ecr.aws/docker/library/busybox:stable
    command: ["sh", "-c", "echo written-by-$NODE > /hostdir/who.txt; sleep 3600"]
    env:
    - { name: NODE, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
    volumeMounts: [{ name: hostdir, mountPath: /hostdir }]
