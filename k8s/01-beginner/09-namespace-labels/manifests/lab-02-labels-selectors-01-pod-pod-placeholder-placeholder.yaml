# Source: k8s/01-beginner/09-namespace-labels/lab-02-labels-selectors.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: v1
kind: Pod
metadata:
  name: pod-$env-$tier
  labels:
    env: $env
    tier: $tier
spec:
  containers:
    - name: main
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "3600"]
