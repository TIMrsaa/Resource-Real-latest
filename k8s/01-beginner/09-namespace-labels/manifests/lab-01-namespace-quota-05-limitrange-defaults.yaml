# Source: k8s/01-beginner/09-namespace-labels/lab-01-namespace-quota.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: dev }
spec:
  limits:
  - type: Container
    defaultRequest: { cpu: 50m, memory: 64Mi }
    default: { memory: 128Mi }
