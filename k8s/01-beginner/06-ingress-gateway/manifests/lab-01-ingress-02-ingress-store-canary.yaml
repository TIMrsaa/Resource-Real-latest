# Source: k8s/01-beginner/06-ingress-gateway/lab-01-ingress.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"            # ← nginx 전용
    nginx.ingress.kubernetes.io/canary-weight: "10"       # ← nginx 전용
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: store-v2, port: { number: 80 } }
