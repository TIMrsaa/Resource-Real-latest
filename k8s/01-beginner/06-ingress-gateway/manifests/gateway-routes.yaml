# Gateway (인프라팀 영역) + HTTPRoute (개발팀 영역)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gw
spec:
  gatewayClassName: nginx          # NGINX Gateway Fabric 설치 시 생기는 클래스
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: { from: Same }   # 같은 네임스페이스의 Route만 허용
---
# 경로 라우팅 + 가중치 카나리 (v1:90 / v2:10)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store-route
spec:
  parentRefs: [{ name: main-gw }]
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - { name: store-v1, port: 80, weight: 90 }
    - { name: store-v2, port: 80, weight: 10 }
---
# 헤더 매칭: x-beta: "yes" 면 무조건 v2 (위 rule보다 구체적이므로 우선)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store-beta-route
spec:
  parentRefs: [{ name: main-gw }]
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
      headers:
      - { name: x-beta, value: "yes" }
    backendRefs:
    - { name: store-v2, port: 80 }
