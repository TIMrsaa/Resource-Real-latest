# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: too-big
  labels: { run: too-big }
spec:
  containers:
    - name: too-big
      image: public.ecr.aws/nginx/nginx:latest
      resources:
        requests:
          cpu: "100"          # 100 코어 — 어떤 노드도 만족 못 하는 요구
