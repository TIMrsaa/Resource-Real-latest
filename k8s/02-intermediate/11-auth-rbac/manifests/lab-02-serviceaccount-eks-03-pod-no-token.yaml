# Source: k8s/02-intermediate/11-auth-rbac/lab-02-serviceaccount-eks.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: no-token
  namespace: rbac-lab
  labels: { run: no-token }
spec:
  automountServiceAccountToken: false
  containers:
    - name: no-token
      image: public.ecr.aws/docker/library/busybox:stable
      command: ["sleep", "300"]
