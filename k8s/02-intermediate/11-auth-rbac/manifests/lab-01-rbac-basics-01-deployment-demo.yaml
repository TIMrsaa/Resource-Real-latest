apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: rbac-lab
  labels: { app: demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo }
  template:
    metadata:
      labels: { app: demo }
    spec:
      containers:
        - name: demo
          image: public.ecr.aws/nginx/nginx:1.27
