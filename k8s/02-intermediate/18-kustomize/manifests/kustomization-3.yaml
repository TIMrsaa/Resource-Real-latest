# Source: k8s/02-intermediate/18-kustomize/lab-02-generators-helm.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rendered.yaml
namespace: kz-prod
labels:
- pairs:
    corp.example.com/cost-center: "team-shop"     # 회사 비용 추적 라벨 강제
  includeSelectors: false
patches:
- target: { kind: Deployment }
  patch: |-
    - op: add
      path: /spec/template/spec/automountServiceAccountToken
      value: false
