# Source: k8s/02-intermediate/14-probes-lifecycle/lab-01-probes.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata: { name: slow-boot }
spec:
  containers:
  - name: app
    image: public.ecr.aws/docker/library/busybox:stable
    # 40초 걸려 "기동"한 후 파일 생성 → 그때부터 건강
    command: ["sh", "-c", "sleep 40 && touch /tmp/ready && sleep 3600"]
    startupProbe:
      exec: { command: [cat, /tmp/ready] }
      periodSeconds: 5
      failureThreshold: 12          # 최대 60초 유예
    livenessProbe:
      exec: { command: [cat, /tmp/ready] }
      periodSeconds: 5
      failureThreshold: 1           # 매우 엄격 — 그러나 startup이 막아줌
