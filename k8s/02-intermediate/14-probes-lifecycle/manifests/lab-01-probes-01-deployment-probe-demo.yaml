# Source: k8s/02-intermediate/14-probes-lifecycle/lab-01-probes.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: probe-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: probe-demo } }
  template:
    metadata: { labels: { app: probe-demo } }
    spec:
      containers:
      - name: app
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports: [{ containerPort: 8080 }]
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata: { name: probe-demo }
spec:
  selector: { app: probe-demo }
  ports: [{ port: 80, targetPort: 8080 }]
