# Source: k8s/02-intermediate/20-jobs-cron/lab-01-jobs.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: batch/v1
kind: Job
metadata: { name: sharded }
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: shard
        image: public.ecr.aws/docker/library/busybox:stable
        command: ["sh", "-c",
          "echo \"shard $JOB_COMPLETION_INDEX: processing rows $((JOB_COMPLETION_INDEX*250))-$(((JOB_COMPLETION_INDEX+1)*250-1))\"; sleep 3"]
