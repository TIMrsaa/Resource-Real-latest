# Source: k8s/02-intermediate/15-networkpolicy/lab-02-namespace-egress.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: db-no-egress, namespace: shop }
spec:
  podSelector: { matchLabels: { app: db } }
  policyTypes: [Egress]
  # egress 섹션 자체가 없음 = 아무것도 허용 안 함
