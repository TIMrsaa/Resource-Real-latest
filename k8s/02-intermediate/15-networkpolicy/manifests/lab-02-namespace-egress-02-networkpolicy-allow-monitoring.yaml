# Source: k8s/02-intermediate/15-networkpolicy/lab-02-namespace-egress.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-monitoring, namespace: shop }
spec:
  podSelector: {}                # shop의 모든 Pod에
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring   # ns 이름 라벨 (자동 부여)
    ports: [{ protocol: TCP, port: 8080 }]
