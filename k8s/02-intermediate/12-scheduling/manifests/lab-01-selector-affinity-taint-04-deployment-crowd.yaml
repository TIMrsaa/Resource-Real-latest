# Source: k8s/02-intermediate/12-scheduling/lab-01-selector-affinity-taint.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowd
  labels: { app: crowd }
spec:
  replicas: 4
  selector:
    matchLabels: { app: crowd }
  template:
    metadata:
      labels: { app: crowd }
    spec:
      containers:
        - name: crowd
          image: public.ecr.aws/docker/library/busybox:stable
          command: ["sleep", "3600"]
