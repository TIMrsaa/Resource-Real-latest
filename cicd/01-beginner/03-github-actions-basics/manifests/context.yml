# Source: cicd/01-beginner/03-github-actions-basics/lab-01-first-workflow.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: context
on:
  workflow_dispatch:
  pull_request:
jobs:
  show:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # ★ 최소 권한 선언 (기본을 좁힙니다)
    steps:
      - name: 이 실행은 무엇인가
        run: |
          echo "event      = ${{ github.event_name }}"
          echo "ref        = ${{ github.ref }}"
          echo "sha        = ${{ github.sha }}"
          echo "actor      = ${{ github.actor }}"
          echo "run_id     = ${{ github.run_id }}"
      - name: 시크릿은 존재하는가 (값은 안 보입니다)
        run: |
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then echo "GITHUB_TOKEN: 있음"; fi
          echo "마스킹 확인: ${{ secrets.GITHUB_TOKEN }}"    # → *** 로 나옵니다
