# Source: cicd/02-intermediate/12-gitlab-ci/lab-02-runners-and-integration.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
stages: [prepare, build, test, deploy]

# stage 순서를 무시하고 needs로 최적 병렬 (DAG)
prepare-a: { stage: prepare, script: ["echo A"] }
prepare-b: { stage: prepare, script: ["echo B"] }

build-x:
  stage: build
  needs: [prepare-a]        # prepare-b를 안 기다립니다!
  script: ["echo build X"]

build-y:
  stage: build
  needs: [prepare-b]
  script: ["echo build Y"]

test-x:
  stage: test
  needs: [build-x]          # build-y 무관
  script: ["echo test X"]

deploy:
  stage: deploy
  needs: [test-x, build-y]  # 둘 다 필요
  script: ["echo deploy"]
