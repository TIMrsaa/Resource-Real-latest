# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
version: 0.2
phases:
  build:
    commands:
      - echo "빌드 중 — 소스가 여기 도착했다"
      - ls -la
      - echo "artifact-$(date +%s)" > build-output.txt
artifacts:
  files:
    - build-output.txt          # ★ 이 파일이 BuildArtifact가 되어 다음 스테이지로
