# Source: cicd/02-intermediate/07-gha-oidc-aws/lab-02-scope-and-environments.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: unrelated-repo
on: [push, workflow_dispatch]
permissions: { id-token: write, contents: read }
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::$ACCOUNT_ID:role/gha-oidc-lab
          aws-region: $AWS_REGION
      - name: 나는 이 역할과 아무 관계 없는 저장소입니다
        run: |
          aws sts get-caller-identity
          aws ecr describe-repositories --region $AWS_REGION --query 'repositories[].repositoryName' || true
