# Source: cicd/02-intermediate/11-codedeploy-strategies/lab-02-rollback-and-db.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: pg
  namespace: deploylab
  labels: { app: pg }
spec:
  containers:
    - name: pg
      image: postgres:17
      env:
        - name: POSTGRES_PASSWORD
          value: test
      ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: deploylab
spec:
  selector: { app: pg }
  ports:
    - port: 5432
