name: scale-demo
on: workflow_dispatch
jobs:
  parallel:
    runs-on: eks-runners
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - run: |
          echo "shard ${{ matrix.shard }} on $(hostname)"
          sleep 45
