# Source: cicd/02-intermediate/08-gha-self-hosted/lab-02-isolation-and-iam.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: oidc-on-runner
on: workflow_dispatch
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    runs-on: eks-runners
    steps:
      - name: OIDC 토큰은 러너 종류와 무관합니다
        run: |
          if [ -n "\$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✅ self-hosted 러너에서도 OIDC 토큰 요청 가능"
          fi
      # 실제로는: aws-actions/configure-aws-credentials로 07의 역할 assume
