# Source: cicd/02-intermediate/06-gha-advanced/lab-01-reusable.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: secrets-demo
on: workflow_dispatch
jobs:
  # ❌ 위험: 모든 시크릿을 넘깁니다
  inherit-all:
    uses: $SHARED/.github/workflows/reusable-ci.yml@$SHA
    secrets: inherit

  # ✅ 안전: 필요한 것만 (이 예시에선 아무것도 필요 없습니다)
  explicit:
    uses: $SHARED/.github/workflows/reusable-ci.yml@$SHA
