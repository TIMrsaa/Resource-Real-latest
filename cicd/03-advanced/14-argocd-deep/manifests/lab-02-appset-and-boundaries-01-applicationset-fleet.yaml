# Source: cicd/03-advanced/14-argocd-deep/lab-02-appset-and-boundaries.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: fleet, namespace: argocd }
spec:
  generators:
    - git:                        # git의 apps/* 디렉터리마다 Application 생성
        repoURL: $REPO_URL
        revision: main
        directories:
          - path: apps/*
  template:
    metadata: { name: 'fleet-{{path.basename}}' }
    spec:
      project: default
      source: { repoURL: $REPO_URL, path: '{{path}}', targetRevision: main }
      destination: { server: https://kubernetes.default.svc, namespace: gitops-fleet }
      syncPolicy:
        automated: { selfHeal: true, prune: true }
        syncOptions: [ CreateNamespace=true ]
