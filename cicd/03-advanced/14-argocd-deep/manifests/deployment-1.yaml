# Source: cicd/03-advanced/14-argocd-deep/lab-02-appset-and-boundaries.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: Deployment
metadata: { name: $app, namespace: gitops-fleet }
spec:
  replicas: 1
  selector: { matchLabels: { app: $app } }
  template:
    metadata: { labels: { app: $app } }
    spec:
      containers:
      - name: app
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        env: [{ name: PODINFO_UI_MESSAGE, value: "$app" }]
