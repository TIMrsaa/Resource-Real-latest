# Source: cicd/03-advanced/14-argocd-deep/lab-01-reconcile-loop.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: demo, namespace: gitops-demo }
spec:
  replicas: 2                    # ★ 이 값이 git의 "진실"
  selector: { matchLabels: { app: demo } }
  template:
    metadata: { labels: { app: demo } }
    spec:
      containers:
      - name: app
        image: ghcr.io/stefanprodan/podinfo:6.7.1    # (04: 실전은 다이제스트)
        ports: [{ containerPort: 9898 }]
