# Source: cicd/03-advanced/18-custom-actions-dev/lab-01-build-action.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: test-action
on: [push, workflow_dispatch]
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Digest 검증 (내가 만든 액션)
        id: check
        uses: ./                          # 로컬 액션 (같은 저장소)
        continue-on-error: true
        with:
          path: manifests
          fail-on-tag: 'true'
      - name: 결과
        run: echo "위반 ${{ steps.check.outputs.violations }}개 감지됨"
