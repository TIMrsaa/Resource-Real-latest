# Source: cicd/04-production/23-pipeline-observability/lab-02-optimize-and-flaky.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: flaky
on: [workflow_dispatch]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 불안정한 테스트 (40% 실패 — 타이밍 의존 재현)
        run: |
          [ $((RANDOM % 10)) -lt 4 ] && { echo "FLAKY FAIL"; exit 1; } || echo "PASS"
