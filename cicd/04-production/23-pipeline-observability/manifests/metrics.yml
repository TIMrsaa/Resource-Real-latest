# Source: cicd/04-production/23-pipeline-observability/lab-01-measure-dora.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: weekly-metrics
on:
  schedule: [{ cron: '0 0 * * 1' }]     # 매주 월요일
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 지난주 지표 집계
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status=="completed")] |
                  "runs=\(length) success=\([.[]|select(.conclusion=="success")]|length)"'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      # 실전: 집계 결과를 대시보드 저장소/메트릭 시스템으로 push (eks 12의 파이프라인과 합류)
