# Source: cicd/04-production/24-enterprise-patterns/lab-01-approval-and-audit.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: approval-context
on: [pull_request]
permissions: { contents: read, pull-requests: write }
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 승인 판단 재료 자동 생성
        run: |
          {
            echo "## 승인 참고 (자동 생성)"
            echo "- 변경 파일: $(git diff --name-only origin/main...HEAD | wc -l)개"
            echo "- 변경 영역: $(git diff --name-only origin/main...HEAD | cut -d/ -f1 | sort -u | tr '\n' ' ')"
            echo "- diff 크기: +$(git diff --shortstat origin/main...HEAD | grep -oE '[0-9]+ insertion' | cut -d' ' -f1 || echo 0)"
            echo "- 롤백: revert 커밋으로 가능 (스키마 변경 없음 여부는 diff의 migrations/ 참조)"
          } > summary.md
          cat summary.md
      - uses: marocchino/sticky-pull-request-comment@v2
        with: { path: summary.md }
        continue-on-error: true
