# Source: cicd/04-production/22-secrets-management/lab-02-gitops-secrets.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: store }
spec:
  provider:
    fake:
      data:
        - key: prod/db-password
          value: "$SECRET_VALUE"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: db-eso }
spec:
  refreshInterval: 15s
  secretStoreRef: { name: store, kind: SecretStore }
  target: { name: db-eso }
  data:
    - secretKey: password
      remoteRef: { key: prod/db-password }
