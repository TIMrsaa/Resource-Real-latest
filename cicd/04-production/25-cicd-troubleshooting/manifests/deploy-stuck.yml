  cancel-in-progress: false       # 배포는 취소 금지 (옳음) — 그러나...
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production       # 🐛 승인 대기가 그룹을 점유합니다!
    steps: [{ run: echo deploying }]
