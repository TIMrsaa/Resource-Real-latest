# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
name: broken-d
on: [workflow_dispatch]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 산출물 생성
        run: mkdir -p dist && echo "built" > dist/app.js
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 산출물 배포
        run: cat dist/app.js
