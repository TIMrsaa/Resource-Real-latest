#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
name: broken-b
on: [workflow_dispatch]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { shard: [1, 2, 3] }
    steps:
      - name: 샤드 ${{ matrix.shard }} 테스트
        run: |
          [ "${{ matrix.shard }}" = "2" ] && sleep 3 && exit 1
          sleep 30 && echo "shard ${{ matrix.shard }} pass"
