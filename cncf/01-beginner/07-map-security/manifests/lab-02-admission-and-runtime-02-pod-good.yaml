apiVersion: v1
kind: Pod
metadata: { name: good }
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 1000 }
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.27
      securityContext: { runAsNonRoot: true }
