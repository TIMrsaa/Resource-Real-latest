# Source: cncf/01-beginner/02-map-orchestration/lab-02-gang-scheduling.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: train-$JOB }
spec:
  serviceName: train-$JOB
  replicas: 4
  selector: { matchLabels: { job: $JOB } }
  template:
    metadata: { labels: { job: $JOB } }
    spec:
      containers:
        - name: worker
          image: busybox
          command: ["sh","-c","echo waiting for all workers...; sleep 3600"]
          resources: { requests: { cpu: "700m" } }   # 노드당 2~3개만 수용 가능하게
