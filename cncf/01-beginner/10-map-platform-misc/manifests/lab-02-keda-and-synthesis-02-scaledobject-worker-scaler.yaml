# Source: cncf/01-beginner/10-map-platform-misc/lab-02-keda-and-synthesis.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: worker-scaler }
spec:
  scaleTargetRef: { name: worker }
  minReplicaCount: 0                 # ★ HPA는 최소 1 — KEDA는 0 가능
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
    - type: cron
      metadata:
        timezone: Asia/Seoul
        start: "0 * * * *"           # 매시 정각
        end: "59 * * * *"            # 매시 59분 (실습: 사실상 항상 활성)
        desiredReplicas: "3"
