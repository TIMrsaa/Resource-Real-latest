# Source: cncf/01-beginner/05-map-storage/lab-02-csi-anatomy.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: csi-hostpath-sc }
provisioner: hostpath.csi.k8s.io      # ★ 어느 드라이버가 담당하는지의 연결 고리
volumeBindingMode: WaitForFirstConsumer  # Pod가 뜰 노드를 알아야 만드는 지연 바인딩
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-hostpath-sc
  resources: { requests: { storage: 1Gi } }
