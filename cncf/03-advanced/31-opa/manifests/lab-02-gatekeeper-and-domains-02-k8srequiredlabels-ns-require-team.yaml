apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata: { name: ns-require-team }
spec:
  enforcementAction: dryrun          # ★ 07의 audit부터 (dryrun→deny)
  match:
    kinds: [{ apiGroups: [""], kinds: ["Namespace"] }]
  parameters:
    labels: ["team"]
