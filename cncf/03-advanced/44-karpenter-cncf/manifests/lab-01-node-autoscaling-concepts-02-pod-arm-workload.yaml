kind: Pod
metadata:
  name: arm-workload
spec:
  nodeSelector:
    kubernetes.io/arch: arm64      # ARM 노드를 요구
  containers:
    - name: app
      image: registry.k8s.io/pause:3.9
      resources: { requests: { cpu: "1" } }
