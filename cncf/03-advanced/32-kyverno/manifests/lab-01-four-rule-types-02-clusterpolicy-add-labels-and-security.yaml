# Source: cncf/03-advanced/32-kyverno/lab-01-four-rule-types.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: add-labels-and-security }
spec:
  rules:
    - name: add-team-label
      match: { any: [{ resources: { kinds: [Pod] } }] }
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              team: "{{ request.namespace }}"      # 변수 치환
          spec:
            securityContext:
              +(runAsNonRoot): true                # +() = 없으면 추가
