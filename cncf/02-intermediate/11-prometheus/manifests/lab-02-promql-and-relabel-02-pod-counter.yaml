# Source: cncf/02-intermediate/11-prometheus/lab-02-promql-and-relabel.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata:
  name: counter
  annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080" }
  labels: { app: counter }
spec:
  containers:
    - name: app
      image: python:3.12-slim
      command: ["python","/src/app.py"]
      volumeMounts: [{ name: src, mountPath: /src }]
  volumes: [{ name: src, configMap: { name: counter-app } }]
