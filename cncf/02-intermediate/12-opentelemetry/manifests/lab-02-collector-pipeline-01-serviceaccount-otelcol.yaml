# Source: cncf/02-intermediate/12-opentelemetry/lab-02-collector-pipeline.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: ServiceAccount
metadata: { name: otelcol }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: otelcol }
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: otelcol }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otelcol }
subjects: [{ kind: ServiceAccount, name: otelcol, namespace: obs }]
