# Source: cncf/02-intermediate/12-opentelemetry/lab-01-context-propagation.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports: [{ containerPort: 4317 }, { containerPort: 16686 }]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger }
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp, port: 4317 }
    - { name: ui,   port: 16686 }
