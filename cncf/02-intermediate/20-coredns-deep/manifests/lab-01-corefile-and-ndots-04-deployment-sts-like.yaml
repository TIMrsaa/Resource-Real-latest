# Source: cncf/02-intermediate/20-coredns-deep/lab-01-corefile-and-ndots.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sts-like
  labels: { app: sts-like }
spec:
  replicas: 3
  selector:
    matchLabels: { app: sts-like }
  template:
    metadata:
      labels: { app: sts-like }
    spec:
      containers:
        - name: nginx
          image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: headless
spec:
  clusterIP: None                    # ★ headless — 가상 IP 없이 Pod IP들이 그대로
  selector: { app: sts-like }
  ports:
    - port: 80
