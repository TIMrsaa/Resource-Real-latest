apiVersion: v1
kind: Pod
metadata: { name: probe-low-ndots }
spec:
  containers:
    - name: c
      image: nicolaka/netshoot
      command: ["sleep","3600"]
  dnsConfig:
    options:
      - { name: ndots, value: "2" }     # ★ 점 2개 미만만 search 적용
