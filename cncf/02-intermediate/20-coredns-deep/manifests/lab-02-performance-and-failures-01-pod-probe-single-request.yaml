# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
apiVersion: v1
kind: Pod
metadata: { name: probe-single-request }
spec:
  containers: [{ name: c, image: nicolaka/netshoot, command: ["sleep","3600"] }]
  dnsConfig:
    options:
      - { name: single-request-reopen }     # A/AAAA를 순차·별도 소켓으로
      - { name: ndots, value: "2" }
