# Source: cncf/02-intermediate/14-fluentd-fluentbit/lab-02-structured-and-correlated.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
# ⚠️ 셸 변수($VAR)가 포함되어 있습니다 — 실행 전 실제 값으로 치환하거나,
#    원본 문서의 절차대로 export 후 envsubst 등으로 적용하세요.
apiVersion: v1
kind: Pod
metadata: { name: app-$V, labels: { app: app-$V } }
spec:
  containers:
    - name: app
      image: python:3.12-slim
      command: ["python","/src/$V.py"]
      volumeMounts: [{ name: src, mountPath: /src }]
  volumes: [{ name: src, configMap: { name: apps } }]
