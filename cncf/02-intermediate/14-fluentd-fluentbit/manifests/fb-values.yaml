# Source: cncf/02-intermediate/14-fluentd-fluentbit/lab-01-pipeline-and-loss.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
config:
  service: |
    [SERVICE]
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        storage.metrics on
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        storage.type memory
        DB /var/log/flb_kube.db
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
  outputs: |
    [OUTPUT]
        Name stdout
        Match kube.*
        Format json_lines
