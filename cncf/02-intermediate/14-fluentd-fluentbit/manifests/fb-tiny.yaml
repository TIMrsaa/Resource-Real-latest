# Source: cncf/02-intermediate/14-fluentd-fluentbit/lab-01-pipeline-and-loss.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
config:
  service: |
    [SERVICE]
        Flush 5
        Log_Level info
        storage.metrics on
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/flooder*.log
        multiline.parser cri
        Tag kube.*
        Mem_Buf_Limit 1KB
        storage.type memory
  outputs: |
    [OUTPUT]
        Name stdout
        Match kube.*
        Format json_lines
        Retry_Limit 1
