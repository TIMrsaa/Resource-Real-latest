# Source: cncf/02-intermediate/14-fluentd-fluentbit/lab-02-structured-and-correlated.md
# 이 파일은 위 실습 문서에서 사용한 매니페스트의 복사본입니다 (학습 편의용).
config:
  service: |
    [SERVICE]
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/app-*.log
        multiline.parser cri
        Tag kube.*
        Mem_Buf_Limit 20MB
        storage.type memory
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On                # ★ log 필드가 JSON이면 파싱해 최상위로 병합
        Merge_Log_Key app
        Keep_Log Off
  outputs: |
    [OUTPUT]
        Name stdout
        Match kube.*
        Format json_lines
