# =============================================================================
# pod.yaml — 가장 단순한 Pod 1개 띄우기 (실무에선 직접 안 쓰지만 학습용)
# =============================================================================
# 핵심 개념:
#   • Pod는 K8s의 최소 배포 단위. 컨테이너 1~N개를 묶어서 같이 띄움
#   • Pod는 "단명"함 — 노드가 죽거나 재시작되면 사라지고 자동 복구 안됨
#   • 실무에선 Deployment를 통해 간접적으로 만든다 (deployment.yaml 참고)
# 적용:  kubectl apply -f pod.yaml
# 확인:  kubectl get pod hello-pod -o wide
# 삭제:  kubectl delete -f pod.yaml
# =============================================================================

apiVersion: v1                  # Pod는 core API group(v1)에 속함. group 이름이 비어있어 "v1"만 적음
kind: Pod                       # 만들려는 객체 종류
metadata:                       # 객체의 메타데이터 (이름/라벨/네임스페이스 등)
  name: hello-pod               # Pod 이름. 같은 NS 안에서 유일해야 함
  labels:                       # 셀렉터로 검색/그룹핑할 키-값 (Service가 이 라벨로 Pod를 찾음)
    app: hello                  # "이 Pod는 hello 앱이다" 라는 식별표
spec:                           # 원하는 상태 명세 (Pod의 본체 정의)
  containers:                   # 이 Pod 안에 띄울 컨테이너 목록 (보통 1개, 사이드카면 2~3개)
    - name: web                 # 컨테이너 이름 (Pod 내에서 유일)
      image: nginx:1.27         # 사용할 이미지. :latest 절대 금지 (재현성 ↓)
      ports:                    # 컨테이너가 노출하는 포트 (정보용, 실제 노출은 Service가 담당)
        - containerPort: 80     # nginx가 듣는 포트
      resources:                # 자원 요청/한도. 미설정 시 노드 자원 다 먹을 수 있음 (위험!)
        requests:               # "최소 이만큼은 보장해줘" — 스케줄러가 이 값으로 노드 선택
          cpu: 50m              # 50 milliCPU = 0.05 vCPU
          memory: 64Mi          # 64 메비바이트 (Mi = 2^20 바이트)
        limits:                 # "이 이상은 못 쓴다" — 초과 시 CPU는 throttle, 메모리는 OOMKilled
          cpu: 200m             # 0.2 vCPU
          memory: 128Mi
