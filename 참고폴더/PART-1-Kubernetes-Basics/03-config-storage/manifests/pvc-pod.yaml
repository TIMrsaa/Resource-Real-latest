# =============================================================================
# pvc-pod.yaml — PV/PVC 동적 프로비저닝 (영구 저장소 사용 패턴)
# =============================================================================
# 개념 한장 그림:
#
#   ┌─ PVC (사용 신청서) ─┐    ┌─ StorageClass (어떤 종류?) ─┐
#   │  "5Gi 주세요"       │ →  │  gp3, ext4, ebs.csi.aws.com │
#   └────────┬────────────┘    └─────────┬───────────────────┘
#            ↓                            ↓ (자동 생성)
#   ┌─ PV (실제 저장소) ──────────────────────┐
#   │  AWS EBS Volume (5Gi gp3, ap-northeast-2a)│
#   └────────┬────────────────────────────────┘
#            ↓ (마운트)
#   ┌─ Pod ───────────────────────────────────┐
#   │  /data 경로에서 읽기/쓰기 가능           │
#   └─────────────────────────────────────────┘
#
# 흐름:
#   1) Pod이 PVC를 참조 → K8s가 StorageClass 보고 EBS 자동 생성
#   2) PV가 생기고 PVC에 바인딩됨
#   3) Pod의 노드에 EBS 어태치, 컨테이너 안에 마운트
#   4) Pod 죽고 새로 떠도 같은 PVC 쓰면 같은 EBS 그대로 (데이터 보존)
#
# accessModes 종류:
#   • ReadWriteOnce (RWO) : 단일 노드에서만 읽기/쓰기 (EBS의 한계)
#   • ReadOnlyMany  (ROX) : 여러 노드에서 읽기만
#   • ReadWriteMany (RWX) : 여러 노드에서 읽기/쓰기 (EFS, FSx 필요)
#
# 적용:  kubectl apply -f pvc-pod.yaml
# 확인:  kubectl get pvc,pv
#       kubectl logs -f pvcdemo
# =============================================================================

# ── PVC: "5Gi 짜리 EBS 주세요" 신청서 ────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: gp3         # 어떤 종류의 스토리지? (storageclass-gp3.yaml 참고)
                                # 미지정 시 default StorageClass 사용
  accessModes: [ReadWriteOnce]  # EBS는 RWO만 가능 (한 노드에서만 마운트)
  resources:
    requests:
      storage: 5Gi              # 요청 용량. EBS는 Provisioner가 정확히 이 크기 생성

---
# ── Pod: PVC를 마운트해서 사용 ───────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: pvcdemo
spec:
  containers:
    - name: writer
      image: alpine:3.19
      command: ["sh", "-c"]
      args:
        - |
          echo "Writing to PV at $(date)..." >> /data/log.txt
          tail -f /data/log.txt    # 컨테이너 살아있게 유지 + 로그 보기
      volumeMounts:
        - name: data
          mountPath: /data        # 컨테이너 안의 경로. 여기 파일 쓰면 EBS에 영구 저장
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data           # 위에서 만든 PVC 이름
