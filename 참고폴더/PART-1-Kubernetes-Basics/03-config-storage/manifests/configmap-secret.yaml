# =============================================================================
# configmap-secret.yaml — 설정/비밀값을 컨테이너에 주입하는 4가지 방법
# =============================================================================
# 왜 외부화?
#   • 코드/이미지에 설정값 박으면 환경(dev/prod)별 재빌드 필요 → 비효율
#   • 비밀번호를 이미지에 넣으면 Git/Registry에 영구 노출 → 보안 사고
#   → 12-factor app 원칙: "설정은 환경 변수로 분리"
#
# ConfigMap vs Secret:
#   • 둘 다 키-값 저장소. 사용법 거의 동일
#   • Secret만 base64 인코딩됨 (암호화 아님! → 별도 KMS 암호화 권장)
#   • Secret은 RBAC로 접근 제어 더 엄격하게 가능
#
# 컨테이너 주입 방식 4가지 (이 파일에 모두 등장):
#   1) envFrom + configMapRef : 모든 키를 환경 변수로 일괄 주입
#   2) envFrom + secretRef    : Secret도 같은 방식
#   3) volumeMounts (configMap): 키를 파일로 마운트 (파일 수정 시 자동 반영)
#   4) volumeMounts (secret)   : Secret도 파일로 마운트 (인증서 등에 유리)
#
# 적용:  kubectl apply -f configmap-secret.yaml
# 확인:  kubectl logs configdemo
# =============================================================================

# ── ConfigMap ─────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:                           # 키-값 데이터. 값은 항상 문자열
  LOG_LEVEL: info               # 단순 키-값
  GREETING: "Hello from ConfigMap!"
  app.conf: |                   # 멀티라인 값 (| = 줄바꿈 보존)
    server {                    # 키 이름이 파일명처럼 보이게 만들어
      port = 8080               # volumeMount 시 그대로 파일이 됨
      mode = production
    }
---
# ── Secret ────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque                    # 일반 임의 데이터 (TLS, dockerconfig 등은 다른 type)
stringData:                     # 평문으로 작성하면 K8s가 자동으로 base64 인코딩
                                # (data: 필드는 직접 base64로 써야 함)
  API_KEY: super-secret-key-do-not-commit
  DB_PASSWORD: pa$$w0rd
---
# ── Pod: 위 ConfigMap/Secret을 4가지 방식으로 주입받음 ────────
apiVersion: v1
kind: Pod
metadata:
  name: configdemo
spec:
  containers:
    - name: app
      image: alpine:3.19
      command: ["sh", "-c"]
      args:
        - |
          echo "==== ENV ===="
          env | grep -E '^(LOG_LEVEL|GREETING|API_KEY|DB_PASSWORD)='
          echo
          echo "==== Mounted file (ConfigMap) ===="
          cat /etc/app/app.conf       # ← volumeMount된 파일 읽기
          echo
          echo "==== Mounted file (Secret) ===="
          cat /etc/secret/API_KEY     # ← Secret도 키별로 파일이 됨
          echo
          echo "Sleeping 1h..."
          sleep 3600

      # ── 방식 1, 2: envFrom으로 환경 변수 일괄 주입 ──
      envFrom:
        - configMapRef:
            name: app-config        # ConfigMap의 모든 키가 환경 변수가 됨
        - secretRef:
            name: app-secret        # Secret도 마찬가지

      # ── 방식 3, 4: 볼륨으로 파일 마운트 ──
      volumeMounts:
        - name: config-vol          # 아래 volumes에서 정의한 이름과 매칭
          mountPath: /etc/app       # 컨테이너 안의 경로
                                    # → /etc/app/app.conf 파일이 생김
        - name: secret-vol
          mountPath: /etc/secret
          readOnly: true            # Secret은 읽기 전용 권장

  volumes:                          # Pod 레벨에서 볼륨 정의
    - name: config-vol
      configMap:
        name: app-config            # 어떤 ConfigMap을 마운트할지
    - name: secret-vol
      secret:
        secretName: app-secret
