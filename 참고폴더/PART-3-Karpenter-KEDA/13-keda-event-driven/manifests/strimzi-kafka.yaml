# =============================================================================
# strimzi-kafka.yaml — Strimzi Operator로 Kafka 클러스터 띄우기
# =============================================================================
# Strimzi란?
#   Kafka를 K8s에서 운영하기 위한 Operator (CRD 기반).
#   Kafka, Zookeeper(또는 KRaft), Topic, User 등을 K8s 객체로 관리.
#
# KRaft 모드:
#   기존엔 Kafka가 메타데이터 저장에 Zookeeper를 별도로 띄워야 했음.
#   KRaft = Kafka가 자체 합의 알고리즘으로 메타데이터 관리 (Zookeeper 불필요)
#   → 운영 단순화, 의존성 ↓
#
# 이 파일이 만드는 것 (3개 객체):
#   1. KafkaNodePool : Kafka 노드(브로커+컨트롤러) 1개
#   2. Kafka         : Kafka 클러스터 자체 (리스너, 설정)
#   3. KafkaTopic    : 'notifications' 토픽 (partition 3개)
#
# 전제: Strimzi Operator 가 'kafka' NS에 설치됨
#       (helm install strimzi strimzi/strimzi-kafka-operator -n kafka)
# =============================================================================

# ── 1. KafkaNodePool: Kafka 노드의 풀 ──────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster   # 어떤 Kafka 클러스터에 속하는지
spec:
  replicas: 1                       # Kafka 노드 1개 (학습용, 운영은 3+)
  roles: [controller, broker]       # 한 노드가 두 역할 다 함 (KRaft 단순 구성)
                                    # 운영: controller 3개 + broker 3+개 분리
  storage:
    type: persistent-claim          # PVC로 데이터 영속화
    size: 10Gi
    deleteClaim: true               # 클러스터 삭제 시 PVC도 삭제 (학습용)
                                    # 운영: false (데이터 보호)
    class: gp3
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits:   {cpu: 1, memory: 1Gi}

---
# ── 2. Kafka 클러스터 정의 ──────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled  # KafkaNodePool CRD 사용 활성
    strimzi.io/kraft: enabled       # KRaft 모드 사용 (Zookeeper 없이)
spec:
  kafka:
    version: 3.7.0                  # Kafka 버전
    listeners:                      # 클라이언트 접속점
      - name: plain
        port: 9092                  # 표준 Kafka 포트
        type: internal              # 클러스터 내부 전용
                                    # external: NodePort/LB로 외부 노출
        tls: false                  # 학습용. 운영은 true (SASL/TLS)
    config:                         # Kafka broker 설정
      # 학습용: 모두 1로 (단일 노드라 복제 불가)
      # 운영: 3 이상 (HA 보장)
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:                   # Topic/User CRD 처리하는 부속 컴포넌트
    topicOperator: {}               # KafkaTopic CRD → 실제 토픽 생성
    userOperator: {}                # KafkaUser CRD → SASL 사용자 생성

---
# ── 3. KafkaTopic: 토픽 선언적 관리 ────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: notifications
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster   # 어느 클러스터의 토픽?
spec:
  partitions: 3                      # 파티션 3개
                                     # = 컨슈머 그룹 내 최대 병렬 처리 수
                                     # KEDA maxReplicaCount의 한도
  replicas: 1                        # 복제본 1 (단일 broker라)
                                     # 운영: min 3, partition 자체도 분산
